version: '3.8'

services:
  # 1. PostgreSQL: Durable State Checkpointer for LangGraph
  postgres:
    image: postgres:16-alpine
    container_name: sentinel-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: sentinel
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Langfuse: Self-Hosted LLM Observability & Tracing
  langfuse-server:
    image: langfuse/langfuse:2
    container_name: sentinel-langfuse
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "postgresql://postgres:postgrespassword@postgres:5432/sentinel"
      NEXTAUTH_SECRET: "mysecretkeyforlangfusesentinel123"
      SALT: "mysaltforlangfuse123"
      NEXTAUTH_URL: "http://localhost:3000"
      TELEMETRY_ENABLED: "false"

volumes:
  pgdata:
